<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js with Luma AI</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas></canvas>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/",
            "@lumaai/luma-web": "https://unpkg.com/@lumaai/luma-web@0.2.0/dist/library/luma-web.module.js"
        }
    }
    </script>
    <script type="module">
    import { WebGLRenderer, PerspectiveCamera, Scene } from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { LumaSplatsThree } from '@lumaai/luma-web';

    let canvas = document.querySelector('canvas');

    let renderer = new WebGLRenderer({
        canvas: canvas,
        antialias: false
    });

    renderer.setSize(window.innerWidth, window.innerHeight, false);

    let scene = new Scene();

    let camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 2;

    let controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;

    let splat = new LumaSplatsThree({
        source: 'https://lumalabs.ai/embed/247e9b36-17f0-46cf-a56c-643028041662?mode=sparkles&background=%23ffffff&color=%23000000&showTitle=true&loadBg=true&logoPosition=bottom-left&infoPosition=bottom-right&cinematicVideo=undefined&showMenu=false'
    });
    scene.add(splat);

    renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
    });
    </script>
</body>
</html>
